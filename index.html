<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Prenotazione Centro Estetico</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #f8f9fa; 
            margin: 0; 
            padding: 12px;
            color: #333;
        }
        .app-card { 
            background: white; 
            max-width: 480px; 
            margin: 0 auto; 
            padding: 20px; 
            border-radius: 18px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.08); 
        }
        .logo-container { text-align: center; margin-bottom: 15px; }
        .logo-img { max-width: 120px; height: auto; border-radius: 12px; }
        
        /* Tasti di Navigazione Tab per Mobile */
        .tab-buttons {
            display: flex;
            background: #f1f3f5;
            padding: 4px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            font-size: 14px;
            font-weight: 600;
            color: #6c757d;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .tab-btn.active {
            background: white;
            color: #d63384;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
        }

        /* Form ed Elementi Input */
        .form-group { margin-bottom: 16px; }
        label { font-weight: 600; display: block; margin-bottom: 6px; font-size: 14px; color: #495057; }
        input, select { 
            width: 100%; 
            padding: 14px; 
            border: 1.5px solid #dee2e6; 
            border-radius: 10px; 
            font-size: 16px; /* Evita lo zoom automatico su iPhone */
            background-color: #fff;
            appearance: none;
            -webkit-appearance: none;
        }
        input:focus, select:focus {
            border-color: #d63384;
            outline: none;
        }
        select {
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22293%22%20height%3D%22293%22%3E%3Cpath%20fill%3D%22%236c757d%22%20d%3D%22M201.4%2040.4l-64%2064-64-64L45.4%2068.4l84%2084%2084-84z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 14px center;
            background-size: 12px;
        }
        .btn-submit { 
            background-color: #d63384; 
            color: white; 
            border: none; 
            padding: 16px; 
            border-radius: 12px; 
            cursor: pointer; 
            font-size: 16px; 
            width: 100%; 
            font-weight: 700; 
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(214, 51, 132, 0.25);
        }
        .btn-submit:active { transform: scale(0.98); }

        /* Lista Appuntamenti */
        ul { list-style-type: none; padding: 0; margin-top: 15px; }
        li { 
            background: #fff0f6; 
            border-left: 4px solid #d63384;
            margin-bottom: 12px; 
            padding: 14px; 
            border-radius: 8px; 
            font-size: 14px;
        }
        .esito { margin-top: 15px; font-weight: 600; text-align: center; font-size: 14px; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="app-card">
    <!-- LOGO SALONE -->
    <div class="logo-container">
        <img class="logo-img" src="https://scontent-fco2-1.xx.fbcdn.net/v/t39.30808-6/480468931_1189319156532944_8943714481012053854_n.jpg?stp=dst-jpg_tt6&cstp=mx1003x650&ctp=s1003x650&_nc_cat=111&ccb=1-7&_nc_sid=cc71e4&_nc_ohc=Fs2-WrR3-dkQ7kNvwEHzcjC&_nc_oc=AdqdyOXfzHmLML8Ur_2BKaJ2MXnaniHnElnNPmnYIPvMflL7NKfefU_6iWlSFbqVPYo&_nc_zt=23&_nc_ht=scontent-fco2-1.xx&_nc_gid=TVdK4anBsl2p24uHROhXOg&_nc_ss=7b289&oh=00_AQI-8iwrNJSMIV_v-oFRdCRfyHTayEJuBV_4VkrDndz2uw&oe=6AA0784C" alt="Logo Salone">
    </div>

    <!-- SELETTORE TAB -->
    <div class="tab-buttons">
        <button id="btnTabPrenota" class="tab-btn active" onclick="mostraTab('prenota')">Prenota</button>
        <button id="btnTabMiei" class="tab-btn" onclick="mostraTab('miei')">I Miei Appuntamenti</button>
    </div>

    <!-- SEZIONE 1: PRENOTAZIONE -->
    <div id="sezionePrenota">
        <div class="form-group">
            <label for="nome">Nome e Cognome</label>
            <input type="text" id="nome" placeholder="es. Maria Rossi">
        </div>

        <div class="form-group">
            <label for="telefono">Numero di Telefono</label>
            <input type="tel" id="telefono" placeholder="es. +393331234567">
        </div>

        <div class="form-group">
            <label for="servizio">Trattamento</label>
            <select id="servizio">
                <option value="">Caricamento servizi...</option>
            </select>
        </div>

        <div class="form-group">
            <label for="dataOra">Data e Ora</label>
            <input type="datetime-local" id="dataOra">
        </div>

        <button class="btn-submit" onclick="effettuaPrenotazione()">Conferma Prenotazione</button>
        <div id="esitoPrenotazione" class="esito"></div>
    </div>

    <!-- SEZIONE 2: I MIEI APPUNTAMENTI -->
    <div id="sezioneMiei" class="hidden">
        <div class="form-group">
            <label for="telefonoRicerca">Numero di Telefono</label>
            <input type="tel" id="telefonoRicerca" placeholder="es. +393331234567">
        </div>
        <button class="btn-submit" onclick="cercaAppuntamenti()">Cerca Appuntamenti</button>

        <ul id="listaAppuntamenti"></ul>
    </div>
</div>

<script>
    function mostraTab(tab) {
        document.getElementById('sezionePrenota').classList.add('hidden');
        document.getElementById('sezioneMiei').classList.add('hidden');
        document.getElementById('btnTabPrenota').classList.remove('active');
        document.getElementById('btnTabMiei').classList.remove('active');

        if (tab === 'prenota') {
            document.getElementById('sezionePrenota').classList.remove('hidden');
            document.getElementById('btnTabPrenota').classList.add('active');
        } else {
            document.getElementById('sezioneMiei').classList.remove('hidden');
            document.getElementById('btnTabMiei').classList.add('active');
        }
    }

    async function caricaServizi() {
        const select = document.getElementById('servizio');
        try {
            const response = await fetch('/api/servizi');
            const servizi = await response.json();
            select.innerHTML = '<option value="">-- Seleziona Trattamento --</option>';
            servizi.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s.id;
                opt.textContent = `${s.nome} (${s.durata} min)`;
                select.appendChild(opt);
            });
        } catch (e) {
            select.innerHTML = '<option value="">Errore caricamento trattamenti</option>';
        }
    }

    async function effettuaPrenotazione() {
        const nome = document.getElementById('nome').value.trim();
        const telefono = document.getElementById('telefono').value.trim();
        const servizioId = document.getElementById('servizio').value;
        const dataOraVal = document.getElementById('dataOra').value;
        const esitoDiv = document.getElementById('esitoPrenotazione');

        if (!nome || !telefono || !servizioId || !dataOraVal) {
            alert('Per favore, compila tutti i campi!');
            return;
        }

        esitoDiv.style.color = '#333';
        esitoDiv.textContent = 'Verifica disponibilità...';

        try {
            const response = await fetch('/api/prenota', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    nome_cliente: nome,
                    telefono_cliente: telefono,
                    servizio_id: parseInt(servizioId),
                    data_ora_richiesta: dataOraVal + ':00'
                })
            });

            const res = await response.json();

            if (response.ok) {
                esitoDiv.style.color = '#2b8a3e';
                esitoDiv.textContent = res.messaggio;
            } else {
                esitoDiv.style.color = '#e03131';
                esitoDiv.textContent = res.detail || 'Orario non disponibile.';
            }
        } catch (err) {
            esitoDiv.style.color = '#e03131';
            esitoDiv.textContent = 'Errore di connessione al server.';
        }
    }

    async function cercaAppuntamenti() {
        const telefono = document.getElementById('telefonoRicerca').value.trim();
        const lista = document.getElementById('listaAppuntamenti');
        lista.innerHTML = "";

        if (!telefono) {
            alert("Inserisci un numero di telefono!");
            return;
        }

        try {
            const response = await fetch(`/api/miei-appuntamenti/${encodeURIComponent(telefono)}`);
            const dati = await response.json();

            if (dati.length === 0) {
                lista.innerHTML = "<li>Nessun appuntamento trovato per questo numero.</li>";
                return;
            }

            dati.forEach(app => {
                const li = document.createElement('li');
                li.innerHTML = `<strong>${app.servizio}</strong><br>
                                📅 ${app.data_ora}<br>
                                ⏱️ Durata: ${app.durata_minuti} min`;
                lista.appendChild(li);
            });
        } catch (error) {
            alert("Errore durante la ricerca.");
        }
    }

    caricaServizi();
</script>

</body>
</html>
