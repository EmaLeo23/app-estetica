<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Calendario - Centro Estetico</title>
    
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.10/locales/it.global.min.js"></script>

    <style>
        body { font-family: Arial, sans-serif; background-color: #f8f9fa; margin: 20px; }
        .container { max-width: 1100px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .header-dashboard { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .header-left { display: flex; align-items: center; gap: 15px; }
        .logo-dash { max-height: 50px; border-radius: 8px; }
        h1 { color: #d63384; margin: 0; font-size: 24px; }
        
        .btn-settings-open {
            background-color: #495057; color: white; border: none; padding: 10px 16px; border-radius: 8px;
            font-weight: bold; cursor: pointer; font-size: 14px;
        }

        .legenda { display: flex; gap: 15px; margin-bottom: 15px; font-size: 14px; font-weight: bold; }
        .legenda-item { display: flex; align-items: center; gap: 6px; }
        .dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; }
        .dot-giallo { background-color: #f59f00; }
        .dot-verde { background-color: #2b8a3e; }
        .dot-blu { background-color: #1971c2; }

        #calendar { margin-top: 15px; }
        .fc-event { cursor: pointer; border-radius: 6px; padding: 2px 4px; border: none !important; color: white !important; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; z-index: 9999;
        }
        .modal-content {
            background: white; padding: 25px; border-radius: 12px; width: 95%; max-width: 650px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); text-align: center; max-height: 90vh; overflow-y: auto;
        }
        .modal-btns { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
        .btn-modal { padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; }
        .btn-conferma { background-color: #2b8a3e; color: white; }
        .btn-sposta { background-color: #1971c2; color: white; }
        .btn-operatrice { background-color: #7048e8; color: white; }
        .btn-reset { background-color: #f59f00; color: white; }
        .btn-cancella { background-color: #e03131; color: white; }
        .btn-chiudi { background-color: #6c757d; color: white; }
        .hidden { display: none; }

        .form-group-modal { margin-bottom: 12px; text-align: left; }
        .form-group-modal label { font-size: 12px; font-weight: bold; display: block; margin-bottom: 4px; }
        .form-group-modal input, .form-group-modal select { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; }
        
        .table-orari { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; text-align: left; }
        .table-orari th, .table-orari td { padding: 8px 4px; border-bottom: 1px solid #dee2e6; }
        .table-orari input[type="time"] { padding: 4px; font-size: 12px; width: 75px; }
        .table-orari input[type="checkbox"] { transform: scale(1.3); cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-dashboard">
        <div class="header-left">
            <img id="dashLogo" class="logo-dash" src="" alt="Logo">
            <h1>Agenda Salone - Dashboard</h1>
        </div>
        <button class="btn-settings-open" onclick="apriModalImpostazioni()">⚙️ Impostazioni Salone</button>
    </div>
    
    <div class="legenda">
        <div class="legenda-item"><span class="dot dot-giallo"></span> In Attesa</div>
        <div class="legenda-item"><span class="dot dot-verde"></span> Confermato</div>
        <div class="legenda-item"><span class="dot dot-blu"></span> Spostato / Proposto</div>
    </div>

    <div id="calendar"></div>
</div>

<!-- POP-UP IMPOSTAZIONI SALONE -->
<div id="modalImpostazioni" class="modal-overlay hidden">
    <div class="modal-content">
        <h3 style="margin-top:0; color:#d63384;">⚙️ Impostazioni Orari e Salone</h3>
        
        <div class="form-group-modal">
            <label>URL Immagine Logo:</label>
            <input type="text" id="cfgLogoUrl" placeholder="https://...">
        </div>

        <div class="form-group-modal">
            <label>Numero Operatrici Contemporanee:</label>
            <input type="number" id="cfgOperatrici" min="1" max="10" value="2">
        </div>

        <h4 style="margin: 15px 0 5px 0; text-align:left; color:#495057;">Orari per Ciascun Giorno:</h4>
        
        <table class="table-orari">
            <thead>
                <tr>
                    <th>Giorno</th>
                    <th>Aperto</th>
                    <th>Turno Mattina</th>
                    <th>Turno Pomeriggio</th>
                </tr>
            </thead>
            <tbody id="bodyOrariSettimana">
            </tbody>
        </table>

        <div class="modal-btns">
            <button class="btn-modal btn-conferma" onclick="salvaImpostazioniSalone()">Salva Modifiche</button>
            <button class="btn-modal btn-chiudi" onclick="chiudiModalImpostazioni()">Annulla</button>
        </div>
    </div>
</div>

<!-- POP-UP AZIONE APPUNTAMENTO -->
<div id="modalAzione" class="modal-overlay hidden">
    <div class="modal-content" style="max-width: 420px;">
        <h3 style="margin-top:0; color:#d63384;">Gestione Appuntamento</h3>
        <p id="modalInfoText" style="text-align:left; font-size:14px; line-height:1.5;"></p>

        <div id="boxOperatriceForm" class="form-group-modal hidden" style="background:#f1f3f5; padding:10px; border-radius:8px;">
            <label for="nomeOperatriceInput">Nome Operatrice / Staff:</label>
            <input type="text" id="nomeOperatriceInput" placeholder="es. Elena, Lucia">
            <button class="btn-modal btn-operatrice" style="margin-top:10px; width:100%;" onclick="salvaSoloOperatrice()">Salva Operatrice (Senza Notifica)</button>
        </div>

        <div id="boxSpostaForm" class="form-group-modal hidden" style="background:#f1f3f5; padding:10px; border-radius:8px;">
            <label for="spostaDataGiorno">Scegli Nuovo Giorno:</label>
            <input type="date" id="spostaDataGiorno">
            
            <label for="spostaOraSlot">Scegli Nuovo Orario:</label>
            <select id="spostaOraSlot"></select>

            <button class="btn-modal btn-sposta" style="margin-top:10px; width:100%;" onclick="confermaSpostamentoManuale()">Salva e Avvisa su WhatsApp</button>
        </div>

        <div class="modal-btns">
            <button class="btn-modal btn-conferma" onclick="confermaDaModal()">Conferma e Avvisa WhatsApp</button>
            <button class="btn-modal btn-operatrice" onclick="mostraFormOperatrice()">Assegna Operatrice</button>
            <button class="btn-modal btn-sposta" onclick="mostraFormSposta()">Sposta Appuntamento</button>
            <button class="btn-modal btn-reset" onclick="resettaPinCliente()">Resetta PIN Cliente</button>
            <button class="btn-modal btn-cancella" onclick="cancellaDaModal()">Cancella Appuntamento</button>
            <button class="btn-modal btn-chiudi" onclick="chiudiModalAzione()">Chiudi</button>
        </div>
    </div>
</div>

<script>
    let appuntamentoCorrente = null;
    let eventoCalendarCorrente = null;
    let configGlobale = null;
    const nomiGiorni = { "1": "Lunedì", "2": "Martedì", "3": "Mercoledì", "4": "Giovedì", "5": "Venerdì", "6": "Sabato", "0": "Domenica" };
    const ordineGiorni = ["1", "2", "3", "4", "5", "6", "0"];
    const LINK_APP = "http://127.0.0.1:8000";

    async function caricaImpostazioni() {
        try {
            const res = await fetch('/api/config');
            configGlobale = await res.json();
            
            document.getElementById('cfgOperatrici').value = configGlobale.num_operatrici || 2;
            document.getElementById('cfgLogoUrl').value = configGlobale.logo_url || '';
            
            if(configGlobale.logo_url) {
                document.getElementById('dashLogo').src = configGlobale.logo_url;
            }

            costruisciTabellaGiorni(configGlobale.orari_settimana || {});
            return configGlobale;
        } catch(e) {
            costruisciTabellaGiorni({});
        }
    }

    function costruisciTabellaGiorni(orariDict) {
        const tbody = document.getElementById('bodyOrariSettimana');
        tbody.innerHTML = '';

        ordineGiorni.forEach(gIdx => {
            const info = orariDict[gIdx] || { 
                aperto: (gIdx !== "0" && gIdx !== "1"),
                am_a: '08:30', am_c: '12:30', pm_a: '14:30', pm_c: '19:30' 
            };

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><strong>${nomiGiorni[gIdx]}</strong></td>
                <td style="text-align:center;"><input type="checkbox" id="chk_${gIdx}" ${info.aperto ? 'checked' : ''}></td>
                <td>
                    <input type="time" id="am_a_${gIdx}" value="${info.am_a || ''}"> - 
                    <input type="time" id="am_c_${gIdx}" value="${info.am_c || ''}">
                </td>
                <td>
                    <input type="time" id="pm_a_${gIdx}" value="${info.pm_a || ''}"> - 
                    <input type="time" id="pm_c_${gIdx}" value="${info.pm_c || ''}">
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function apriModalImpostazioni() { document.getElementById('modalImpostazioni').classList.remove('hidden'); }
    function chiudiModalImpostazioni() { document.getElementById('modalImpostazioni').classList.add('hidden'); }

    async function salvaImpostazioniSalone() {
        const orariSettimana = {};

        ordineGiorni.forEach(gIdx => {
            const chk = document.getElementById(`chk_${gIdx}`);
            const am_a = document.getElementById(`am_a_${gIdx}`);
            const am_c = document.getElementById(`am_c_${gIdx}`);
            const pm_a = document.getElementById(`pm_a_${gIdx}`);
            const pm_c = document.getElementById(`pm_c_${gIdx}`);

            orariSettimana[gIdx] = {
                aperto: chk ? chk.checked : false,
                am_a: am_a ? am_a.value : '',
                am_c: am_c ? am_c.value : '',
                pm_a: pm_a ? pm_a.value : '',
                pm_c: pm_c ? pm_c.value : ''
            };
        });

        const payload = {
            num_operatrici: parseInt(document.getElementById('cfgOperatrici').value) || 2,
            logo_url: document.getElementById('cfgLogoUrl').value.trim(),
            orari_settimana: orariSettimana
        };

        try {
            const res = await fetch('/api/admin/config', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });

            if(res.ok) {
                alert("Impostazioni salvate con successo!");
                location.reload();
            } else {
                const err = await res.json();
                alert("Errore salvataggio: " + (err.detail || "Parametri non validi"));
            }
        } catch (e) {
            alert("Errore di connessione al server.");
        }
    }

    function pulisciNumeroTelefono(tel) {
        let pulito = tel.replace(/\D/g, '');
        if (!pulito.startsWith('39') && pulito.length === 10) pulito = '39' + pulito;
        return pulito;
    }

    function apriWhatsApp(telefono, testoMessaggio) {
        const numClean = pulisciNumeroTelefono(telefono);
        window.open(`https://wa.me/${numClean}?text=${encodeURIComponent(testoMessaggio)}`, '_blank');
    }

    function generaOrariSposta() {
        const selectOra = document.getElementById('spostaOraSlot');
        selectOra.innerHTML = '<option value="">-- Seleziona Ora --</option>';

        for (let h = 8; h < 20; h++) {
            for (let m = 0; m < 60; m += 15) {
                const hh = h.toString().padStart(2, '0');
                const mm = m.toString().padStart(2, '0');
                const option = document.createElement('option');
                option.value = `${hh}:${mm}`; option.textContent = `${hh}:${mm}`;
                selectOra.appendChild(option);
            }
        }
    }

    function chiudiModalAzione() {
        document.getElementById('modalAzione').classList.add('hidden');
        document.getElementById('boxSpostaForm').classList.add('hidden');
        document.getElementById('boxOperatriceForm').classList.add('hidden');
    }

    function mostraFormSposta() { document.getElementById('boxSpostaForm').classList.remove('hidden'); }
    function mostraFormOperatrice() { document.getElementById('boxOperatriceForm').classList.remove('hidden'); }

    async function salvaSoloOperatrice() {
        const op = document.getElementById('nomeOperatriceInput').value.trim();
        if(!op) { alert("Inserisci il nome dell'operatrice!"); return; }

        const res = await fetch(`/api/admin/assegna-operatrice/${appuntamentoCorrente.id}`, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ operatrice: op })
        });

        if(res.ok) {
            alert("Operatrice assegnata!");
            location.reload();
        }
    }

    async function confermaDaModal() {
        if (!appuntamentoCorrente) return;
        const res = await fetch(`/api/admin/conferma/${appuntamentoCorrente.id}`, { method: 'POST' });
        if (res.ok) {
            eventoCalendarCorrente.setProp('backgroundColor', '#2b8a3e');
            chiudiModalAzione();

            const msg = `Ciao ${appuntamentoCorrente.cliente}!\n` +
                        `Il tuo appuntamento per ${appuntamentoCorrente.servizio} il ${appuntamentoCorrente.data_ora_formattata} e' stato CONFERMATO.\n\n` +
                        `Puoi controllare le tue prenotazioni qui:\n${LINK_APP}`;
            
            apriWhatsApp(appuntamentoCorrente.telefono, msg);
        }
    }

    async function confermaSpostamentoManuale() {
        if (!appuntamentoCorrente) return;
        const giorno = document.getElementById('spostaDataGiorno').value;
        const ora = document.getElementById('spostaOraSlot').value;

        if (!giorno || !ora) { alert("Seleziona giorno e orario!"); return; }

        const nuovoInizioIso = `${giorno}T${ora}:00`;

        try {
            const res = await fetch(`/api/admin/sposta/${appuntamentoCorrente.id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nuovo_inizio: nuovoInizioIso })
            });

            if (res.ok) {
                eventoCalendarCorrente.setProp('backgroundColor', '#1971c2');
                chiudiModalAzione();

                const partiGiorno = giorno.split('-');
                const dataLeggibile = `${partiGiorno[2]}/${partiGiorno[1]}/${partiGiorno[0]} alle ${ora}`;

                const msg = `Ciao ${appuntamentoCorrente.cliente}!\n` +
                            `Abbiamo proposto un nuovo orario per il tuo trattamento ${appuntamentoCorrente.servizio}:\n` +
                            `Data e Ora: ${dataLeggibile}\n\n` +
                            `Per confermare accedi all'app:\n${LINK_APP}`;
                
                apriWhatsApp(appuntamentoCorrente.telefono, msg);
                location.reload();
            } else {
                alert("Orario non disponibile!");
            }
        } catch (e) { alert("Errore durante lo spostamento."); }
    }

    async function resettaPinCliente() {
        if (!appuntamentoCorrente) return;
        const nuovoPin = prompt(`Inserisci il nuovo PIN a 4 cifre per ${appuntamentoCorrente.cliente}:`, "0000");
        if (!nuovoPin) return;

        const res = await fetch('/api/admin/reset-pin', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ telefono: appuntamentoCorrente.telefono, nuovo_pin: nuovoPin })
        });
        if (res.ok) { alert(`PIN resettato a: ${nuovoPin}`); chiudiModalAzione(); }
    }

    async function cancellaDaModal() {
        if (!appuntamentoCorrente) return;
        if (confirm("Sicuro di voler cancellare questo appuntamento?")) {
            const res = await fetch(`/api/admin/cancella/${appuntamentoCorrente.id}`, { method: 'DELETE' });
            if (res.ok) {
                eventoCalendarCorrente.remove();
                chiudiModalAzione();
                const msg = `Ciao ${appuntamentoCorrente.cliente}. Il tuo appuntamento del ${appuntamentoCorrente.data_ora_formattata} e' stato cancellato.\n\n` +
                            `Per prenotare di nuovo entra qui:\n${LINK_APP}`;
                apriWhatsApp(appuntamentoCorrente.telefono, msg);
            }
        }
    }

    document.addEventListener('DOMContentLoaded', async function() {
        const conf = await caricaImpostazioni();
        generaOrariSposta();
        
        const calendarEl = document.getElementById('calendar');

        async function fetchEventi() {
            const response = await fetch('/api/admin/tutti-appuntamenti');
            const dati = await response.json();

            return dati.map(app => {
                const parti = app.inizio.split(' ');
                const dataParti = parti[0].split('/');
                const dataIso = `${dataParti[2]}-${dataParti[1]}-${dataParti[0]}T${parti[1]}:00`;

                let colore = '#f59f00';
                if (app.stato === 'confermato') colore = '#2b8a3e';
                if (app.stato === 'spostato') colore = '#1971c2';

                return {
                    id: app.id,
                    title: `${app.cliente_nome} (${app.operatrice}) - ${app.servizio}`,
                    start: dataIso,
                    backgroundColor: colore,
                    extendedProps: {
                        id: app.id,
                        telefono: app.cliente_telefono,
                        pin: app.cliente_pin,
                        durata: app.durata_minuti,
                        servizio: app.servizio,
                        cliente: app.cliente_nome,
                        stato: app.stato,
                        operatrice: app.operatrice,
                        data_ora_formattata: app.inizio
                    }
                };
            });
        }

        const eventi = await fetchEventi();

        const chiusi = [];
        if (conf && conf.orari_settimana) {
            Object.keys(conf.orari_settimana).forEach(gIdx => {
                if(!conf.orari_settimana[gIdx].aperto) {
                    chiusi.push(parseInt(gIdx));
                }
            });
        }

        const calendar = new FullCalendar.Calendar(calendarEl, {
            locale: 'it',
            initialView: 'timeGridWeek',
            editable: true,
            slotDuration: '00:15:00',
            hiddenDays: chiusi,
            slotMinTime: "07:00:00",
            slotMaxTime: "21:00:00",
            headerToolbar: { left: 'prev,next today', center: 'title', right: 'dayGridMonth,timeGridWeek,timeGridDay' },
            allDaySlot: false,
            events: eventi,

            eventClick: function(info) {
                appuntamentoCorrente = info.event.extendedProps;
                eventoCalendarCorrente = info.event;

                const txt = `<strong>Cliente:</strong> ${appuntamentoCorrente.cliente}<br>` +
                            `<strong>Tel:</strong> ${appuntamentoCorrente.telefono}<br>` +
                            `<strong>PIN:</strong> <span style="color:#d63384; font-weight:bold;">${appuntamentoCorrente.pin || 'N.D.'}</span><br>` +
                            `<strong>Operatrice:</strong> <span style="color:#7048e8; font-weight:bold;">${appuntamentoCorrente.operatrice}</span><br>` +
                            `<strong>Servizio:</strong> ${appuntamentoCorrente.servizio}<br>` +
                            `<strong>Data/Ora:</strong> ${appuntamentoCorrente.data_ora_formattata}<br>` +
                            `<strong>Stato:</strong> ${appuntamentoCorrente.stato.toUpperCase()}`;

                document.getElementById('modalInfoText').innerHTML = txt;
                document.getElementById('nomeOperatriceInput').value = appuntamentoCorrente.operatrice !== "Non Assegnata" ? appuntamentoCorrente.operatrice : "";
                document.getElementById('modalAzione').classList.remove('hidden');
                document.getElementById('boxSpostaForm').classList.add('hidden');
                document.getElementById('boxOperatriceForm').classList.add('hidden');
            },

            eventDrop: async function(info) {
                const nuovoInizioIso = info.event.start.toISOString().slice(0, 19);

                try {
                    const res = await fetch(`/api/admin/sposta/${info.event.id}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ nuovo_inizio: nuovoInizioIso })
                    });

                    if (res.ok) {
                        info.event.setProp('backgroundColor', '#1971c2');
                        const props = info.event.extendedProps;
                        const msg = `Ciao ${props.cliente}!\n` +
                                    `Abbiamo spostato il tuo appuntamento per ${props.servizio}.\n\n` +
                                    `Controlla il nuovo orario sull'app:\n${LINK_APP}`;
                        apriWhatsApp(props.telefono, msg);
                    } else {
                        alert("Slot occupato!");
                        info.revert();
                    }
                } catch (e) { info.revert(); }
            }
        });

        calendar.render();
    });
</script>

</body>
</html>
